<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MeowFish · 喵鱼</title>
  <link rel="stylesheet" href="/style.css?v=52">
</head>
<body>
  <aside id="sidebar" class="glass">
    <div class="sidebar-head">
      <span class="logo">ฅ(^•ω•^)ฅ</span>
      <span class="logo-text">MeowFish</span>
      <span class="spacer"></span>
      <button id="btn-manage" class="manage-btn" data-i18n="manage" data-i18n-title="manage">管理</button>
    </div>
    <button id="btn-newchat" class="newchat-btn"><svg class="ico" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span data-i18n="new-chat">新建对话</span></button>
    <div class="session-region">
      <div class="session-list-title" data-i18n="recent-sessions">最近会话</div>
      <input id="session-search" type="text" placeholder="搜索会话…" autocomplete="off">
      <div id="session-list"></div>
    </div>
    <div id="manage-bar" class="hidden">
      <label class="manage-all" title="全选"><input type="checkbox" id="manage-select-all"></label>
      <span class="spacer"></span>
      <button id="btn-export-sessions" title="导出所选会话 JSON"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
      <button id="btn-import-sessions" title="从 JSON 导入会话"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></button>
      <button id="btn-manage-cancel" title="退出管理"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      <button id="btn-manage-delete" data-i18n="delete-selected">删除所选</button>
      <input id="sessions-import-file" type="file" accept="application/json" class="hidden">
    </div>
  </aside>
  <div id="sidebar-backdrop" class="hidden"></div>

  <div id="main">
    <header id="header" class="glass">
      <button id="btn-sidebar" class="pill" title="侧边栏"><svg class="ico" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
      <span id="mode-badge">RP</span>
      <span id="title" class="title"></span>
      <span id="yolo-badge" class="hidden">YOLO</span>
      <span id="meta-info" class="meta"></span>
      <span class="spacer"></span>
      <span class="tools-wrap" data-i18n-title="tools">
        <span class="tools-label"><svg class="ico ico-sm" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></span>
        <label class="switch">
          <input type="checkbox" id="tools-switch">
          <span class="slider"></span>
        </label>
      </span>
      <span class="tools-wrap" data-i18n-title="websearch">
        <span class="tools-label"><svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span>
        <label class="switch">
          <input type="checkbox" id="websearch-switch">
          <span class="slider"></span>
        </label>
      </span>
      <button id="btn-model" class="pill" data-i18n-title="model"><svg class="ico ico-sm" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg><span data-i18n="model">模型</span></button>
      <button id="btn-daynight" class="pill" title="日/夜切换"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
      <button id="btn-theme" class="pill" data-i18n-title="theme"><svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="2" x2="12" y2="22"></line><line x1="12" y1="4" x2="12" y2="4"></line></svg><span data-i18n="theme">主题</span></button>
      <button id="btn-menu" class="pill" data-i18n-title="menu"><svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg><span data-i18n="menu">菜单</span></button>
    </header>

    <main id="messages"></main>

    <div id="statusbar" class="glass hidden">
      <span id="kaomoji"></span><span id="status-text"></span>
    </div>

    <div id="quickbar" class="glass">
      <button data-cmd="/swipe" data-i18n-title="regenerate"><svg class="ico" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg><span data-i18n="regenerate">重生成</span></button>
      <button data-cmd="/continue" data-i18n-title="continue"><svg class="ico" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg><span data-i18n="continue">续写</span></button>
      <button data-cmd="/character" data-i18n-title="character"><svg class="ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span data-i18n="character">角色</span></button>
      <button data-cmd="/tools" data-i18n-title="tools"><svg class="ico" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg><span data-i18n="tools">工具</span></button>
      <button id="btn-sshterm" data-i18n-title="sshterm"><svg class="ico" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg><span data-i18n="sshterm">终端</span></button>
      <button id="btn-voice" data-i18n-title="voice"><svg class="ico" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg><span data-i18n="voice">语音</span></button>
      <div class="quickbar-more-wrap">
        <button id="quickbar-more" class="more-btn" data-i18n-title="more" title="更多"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
      </div>
      <button id="btn-abort" class="abort hidden" data-i18n-title="abort"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg><span data-i18n="abort">中断</span></button>
    </div>
    <footer id="composer" class="glass">
      <button id="btn-mic" class="mic-btn" data-i18n-title="mic-hold" title="按住说话（松开识别）"><svg class="ico" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
      <textarea id="input" rows="1" data-i18n-placeholder="input-placeholder" placeholder="输入消息…（@ 引用文件 · / 命令）" autocomplete="off"></textarea>
      <button id="btn-send"><svg class="ico" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg><span data-i18n="send">发送</span></button>
    </footer>

    <div id="modal-backdrop" class="hidden">
      <div id="modal" class="glass">
        <div id="modal-title"></div>
        <div id="modal-filter" class="hidden"><input id="modal-filter-input" type="text" placeholder="过滤…"></div>
        <div id="modal-body"></div>
        <div id="modal-actions"></div>
      </div>
    </div>

    <div id="local-confirm-backdrop" class="hidden">
      <div id="local-confirm" class="glass">
        <div id="local-confirm-title"></div>
        <div id="local-confirm-msg"></div>
        <div id="local-confirm-actions">
          <button class="modal-btn primary" id="local-confirm-ok"></button>
          <button class="modal-btn" id="local-confirm-cancel"></button>
        </div>
      </div>
    </div>

    <!-- 免提连续语音对话视图（替换主界面） -->
    <div id="voice-view" class="hidden">
      <div class="vv-top">
        <span class="vv-title" id="voice-mode-title" data-i18n="voice-mode-title">免提语音对话</span>
        <span class="vv-hint" id="vv-hint"></span>
        <button id="voice-exit" data-i18n="voice-exit">退出</button>
      </div>
      <div class="vv-stage">
        <div class="vv-glow"></div>
        <canvas id="voice-canvas" width="360" height="360"></canvas>
        <div class="vv-status" id="voice-status">…</div>
      </div>
      <div class="vv-subs">
        <div class="vv-line" id="vv-user-line"></div>
        <div class="vv-line" id="vv-bot-line"></div>
      </div>
    </div>
  </div>

  <div id="quickbar-menu" class="quickbar-menu hidden">
    <button data-cmd="/profile" data-i18n-title="profile"><svg class="ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle><line x1="19" y1="2" x2="22" y2="5"></line><line x1="19" y1="5" x2="22" y2="2"></line></svg><span data-i18n="profile">设定</span></button>
    <button data-cmd="/search" data-i18n-title="search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span data-i18n="search">搜索</span></button>
    <button data-cmd="/export" data-i18n-title="export"><svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span data-i18n="export">导出</span></button>
    <button data-cmd="/help" data-i18n-title="help"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg><span data-i18n="help">帮助</span></button>
    <button data-cmd="/model" data-i18n-title="model"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg><span data-i18n="model">模型</span></button>
    <button data-cmd="/theme" data-i18n-title="theme"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg><span data-i18n="theme">主题</span></button>
    <button id="btn-daynight-mob" data-i18n-title="daynight"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg><span data-i18n="daynight-short">日夜</span></button>
  </div>

  <!-- Web SSH 交互式终端（桌面风格浮动窗口） -->
  <div id="ssh-term-view" class="hidden">
    <div id="ssh-term-top" class="ssh-term-top">
      <div class="term-window-controls">
        <button id="ssh-term-exit" class="term-ctl term-close" type="button" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        <button id="ssh-term-min" class="term-ctl term-minimize" type="button" title="最小化" aria-label="最小化"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
        <button id="ssh-term-max" class="term-ctl term-zoom" type="button" title="最大化/还原" aria-label="最大化/还原"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
      </div>
      <span class="ssh-term-title">SSH 终端</span>
      <div class="term-top-actions">
        <button id="ssh-term-send" class="term-ico" type="button" title="把最近终端输出发给喵鱼"><svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></button>
        <button id="ssh-term-find" class="term-ico" type="button" title="在当前标签输出中搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        <button id="ssh-term-reconnect" class="term-ico" type="button" title="重新连接当前标签"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg></button>
        <button id="ssh-term-clear" class="term-ico" type="button" title="清屏（Ctrl+L）"><svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg></button>
        <button id="ssh-term-reconfig" class="term-ico" type="button" title="连接设置"><svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg></button>
      </div>
    </div>
    <div class="ssh-term-tabbar">
      <div id="ssh-term-tabs" class="ssh-term-tabs"></div>
      <button id="ssh-term-new" class="term-tab-new" type="button" title="新建连接"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    </div>
    <div id="ssh-term-findbar" class="hidden">
      <input id="ssh-term-find-input" type="text" placeholder="在当前标签输出中搜索…">
      <button id="ssh-term-find-prev" type="button"><svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg><span>上一个</span></button>
      <button id="ssh-term-find-next" type="button"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="5 12 12 19 19 12"></polyline></svg><span>下一个</span></button>
      <button id="ssh-term-find-close" type="button"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    <div id="ssh-term-screen">
      <pre id="ssh-term-output" tabindex="-1"></pre>
    </div>
    <div class="ssh-term-statusbar">
      <span id="ssh-term-status" class="ssh-term-status">未连接</span>
      <span class="spacer"></span>
      <span class="term-hint">Ctrl+1~9 切换标签 · 拖动标题栏移动 · 双击标题栏最大化</span>
    </div>
    <div id="ssh-term-resize" title="拖动调整大小"></div>
    <textarea id="ssh-term-input" rows="1" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  </div>

  <button id="ssh-term-minibutton" class="hidden" type="button" title="恢复 SSH 终端"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg></button>

  <script src="/app.js?v=52"></script>
</body>
</html>
