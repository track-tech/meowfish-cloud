<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MeowFish · 喵鱼</title>
  <link rel="stylesheet" href="/style.css?v=42">
</head>
<body>
  <aside id="sidebar" class="glass">
    <div class="sidebar-head">
      <span class="logo">ฅ(^•ω•^)ฅ</span>
      <span class="logo-text">MeowFish</span>
      <span class="spacer"></span>
      <button id="btn-manage" class="manage-btn" data-i18n="manage" data-i18n-title="manage">管理</button>
    </div>
    <button id="btn-newchat" class="newchat-btn" data-i18n="new-chat">＋ 新建对话</button>
    <div class="session-region">
      <div class="session-list-title" data-i18n="recent-sessions">最近会话</div>
      <input id="session-search" type="text" placeholder="搜索会话…" autocomplete="off">
      <div id="session-list"></div>
    </div>
    <div id="manage-bar" class="hidden">
      <label class="manage-all"><input type="checkbox" id="manage-select-all"> <span data-i18n="select-all">全选</span></label>
      <span class="spacer"></span>
      <button id="btn-export-sessions">导出</button>
      <button id="btn-import-sessions">导入</button>
      <button id="btn-manage-cancel" data-i18n="cancel">取消</button>
      <button id="btn-manage-delete" data-i18n="delete-selected">删除所选</button>
      <input id="sessions-import-file" type="file" accept="application/json" class="hidden">
    </div>
  </aside>
  <div id="sidebar-backdrop" class="hidden"></div>

  <div id="main">
    <header id="header" class="glass">
      <button id="btn-sidebar" class="pill">☰</button>
      <span id="mode-badge">RP</span>
      <span id="title" class="title"></span>
      <span id="yolo-badge" class="hidden">YOLO</span>
      <span id="meta-info" class="meta"></span>
      <span class="spacer"></span>
      <span class="tools-wrap" data-i18n-title="tools">
        <span class="tools-label">🖥️</span>
        <label class="switch">
          <input type="checkbox" id="tools-switch">
          <span class="slider"></span>
        </label>
      </span>
      <span class="tools-wrap" data-i18n-title="websearch">
        <span class="tools-label">🌐</span>
        <label class="switch">
          <input type="checkbox" id="websearch-switch">
          <span class="slider"></span>
        </label>
      </span>
      <button id="btn-model" class="pill" data-i18n="model">模型</button>
      <button id="btn-daynight" class="pill" title="🌙">🌙</button>
      <button id="btn-theme" class="pill" data-i18n="theme">主题</button>
      <button id="btn-menu" class="pill" data-i18n="menu">菜单</button>
    </header>

    <main id="messages"></main>

    <div id="statusbar" class="glass hidden">
      <span id="kaomoji"></span><span id="status-text"></span>
    </div>

    <div id="quickbar" class="glass">
      <button data-cmd="/swipe" data-i18n="regenerate" data-i18n-title="regenerate">🔄 重生成</button>
      <button data-cmd="/continue" data-i18n="continue" data-i18n-title="continue">✍️ 续写</button>
      <button data-cmd="/character" data-i18n="character" data-i18n-title="character">🐱 角色</button>
      <button data-cmd="/profile" data-i18n="profile" data-i18n-title="profile">📝 设定</button>
      <button data-cmd="/tools" data-i18n="tools" data-i18n-title="tools">🛠️ 工具</button>
      <button data-cmd="/search" data-i18n="search" data-i18n-title="search">🔍 搜索</button>
      <button id="btn-sshterm" data-i18n="sshterm" data-i18n-title="sshterm">🖥️ 终端</button>
      <button id="btn-voice" data-i18n="voice" data-i18n-title="voice">🔊 语音</button>
      <button data-cmd="/export" data-i18n="export" data-i18n-title="export">⬇️ 导出</button>
      <button data-cmd="/help" data-i18n="help" data-i18n-title="help">❓ 帮助</button>
      <button data-cmd="/model" class="mob-only" data-i18n="model" data-i18n-title="model">🧠 模型</button>
      <button data-cmd="/theme" class="mob-only" data-i18n="theme" data-i18n-title="theme">🎨 主题</button>
      <button id="btn-daynight-mob" class="mob-only" data-i18n-title="daynight">🌙</button>
      <button id="btn-abort" class="abort hidden" data-i18n="abort" data-i18n-title="abort">⏹ 中断</button>
    </div>

    <footer id="composer" class="glass">
      <button id="btn-mic" class="mic-btn" data-i18n-title="mic-hold" title="按住说话（松开识别）">🎤</button>
      <textarea id="input" rows="1" data-i18n-placeholder="input-placeholder" placeholder="输入消息…（@ 引用文件 · / 命令）" autocomplete="off"></textarea>
      <button id="btn-send" data-i18n="send">发送</button>
    </footer>

    <div id="modal-backdrop" class="hidden">
      <div id="modal" class="glass">
        <div id="modal-title"></div>
        <div id="modal-filter" class="hidden"><input id="modal-filter-input" type="text" placeholder="过滤…"></div>
        <div id="modal-body"></div>
        <div id="modal-actions"></div>
      </div>
    </div>

    <div id="local-confirm-backdrop" class="hidden">
      <div id="local-confirm" class="glass">
        <div id="local-confirm-title"></div>
        <div id="local-confirm-msg"></div>
        <div id="local-confirm-actions">
          <button class="modal-btn primary" id="local-confirm-ok"></button>
          <button class="modal-btn" id="local-confirm-cancel"></button>
        </div>
      </div>
    </div>

    <!-- 免提连续语音对话视图（替换主界面） -->
    <div id="voice-view" class="hidden">
      <div class="vv-top">
        <span class="vv-title" id="voice-mode-title" data-i18n="voice-mode-title">免提语音对话</span>
        <span class="vv-hint" id="vv-hint"></span>
        <button id="voice-exit" data-i18n="voice-exit">退出</button>
      </div>
      <div class="vv-stage">
        <div class="vv-glow"></div>
        <canvas id="voice-canvas" width="360" height="360"></canvas>
        <div class="vv-status" id="voice-status">…</div>
      </div>
      <div class="vv-subs">
        <div class="vv-line" id="vv-user-line"></div>
        <div class="vv-line" id="vv-bot-line"></div>
      </div>
    </div>
  </div>

  <!-- Web SSH 交互式终端（桌面风格浮动窗口） -->
  <div id="ssh-term-view" class="hidden">
    <div id="ssh-term-top" class="ssh-term-top">
      <div class="term-window-controls">
        <button id="ssh-term-exit" class="term-ctl term-close" type="button" title="关闭" aria-label="关闭"></button>
        <button id="ssh-term-min" class="term-ctl term-minimize" type="button" title="最小化" aria-label="最小化"></button>
        <button id="ssh-term-max" class="term-ctl term-zoom" type="button" title="最大化/还原" aria-label="最大化/还原"></button>
      </div>
      <span class="ssh-term-title">SSH 终端</span>
      <div class="term-top-actions">
        <button id="ssh-term-send" class="term-ico" type="button" title="把最近终端输出发给喵鱼">🐟</button>
        <button id="ssh-term-find" class="term-ico" type="button" title="在当前标签输出中搜索">🔍</button>
        <button id="ssh-term-reconnect" class="term-ico" type="button" title="重新连接当前标签">⟳</button>
        <button id="ssh-term-clear" class="term-ico" type="button" title="清屏（Ctrl+L）">⌧</button>
        <button id="ssh-term-reconfig" class="term-ico" type="button" title="连接设置">⚙</button>
      </div>
    </div>
    <div class="ssh-term-tabbar">
      <div id="ssh-term-tabs" class="ssh-term-tabs"></div>
      <button id="ssh-term-new" class="term-tab-new" type="button" title="新建连接">＋</button>
    </div>
    <div id="ssh-term-findbar" class="hidden">
      <input id="ssh-term-find-input" type="text" placeholder="在当前标签输出中搜索…">
      <button id="ssh-term-find-prev" type="button">↑ 上一个</button>
      <button id="ssh-term-find-next" type="button">↓ 下一个</button>
      <button id="ssh-term-find-close" type="button">×</button>
    </div>
    <div id="ssh-term-screen">
      <pre id="ssh-term-output" tabindex="-1"></pre>
    </div>
    <div class="ssh-term-statusbar">
      <span id="ssh-term-status" class="ssh-term-status">未连接</span>
      <span class="spacer"></span>
      <span class="term-hint">Ctrl+1~9 切换标签 · 拖动标题栏移动 · 双击标题栏最大化</span>
    </div>
    <div id="ssh-term-resize" title="拖动调整大小"></div>
    <textarea id="ssh-term-input" rows="1" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  </div>

  <button id="ssh-term-minibutton" class="hidden" type="button" title="恢复 SSH 终端">🖥️</button>

  <script src="/app.js?v=42"></script>
</body>
</html>
